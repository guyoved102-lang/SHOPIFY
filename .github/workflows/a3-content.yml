name: A3  -  Content Agent (Weekly Blog)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  write-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sockacademy/agents/A3_content
        run: npm install

      - name: Install corp/core dependencies
        # qa-gate.js (Module 2) requires @anthropic-ai/sdk directly, and
        # self-heal.js (Module 3) requires @anthropic-ai/sdk + hitl.js's
        # @supabase/supabase-js/nodemailer — corp/core is a sibling directory,
        # not an ancestor of A3, so Node module resolution needs corp/core's
        # OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A3 Blog Writer
        working-directory: sockacademy/agents/A3_content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
