name: A17 — Meta Token Refresher

on:
  schedule:
    - cron: '0 8 1 */2 *'   # 1st of every 2nd month at 08:00 UTC (~every 60 days)
  workflow_dispatch:          # manual trigger any time

jobs:
  refresh:
    name: Refresh META_ACCESS_TOKEN
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A17_token_refresher/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A17_token_refresher

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A17, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Refresh token
        env:
          META_APP_ID:       ${{ secrets.META_APP_ID }}
          META_APP_SECRET:   ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GH_TOKEN:          ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER:     ${{ github.repository_owner }}
          GH_REPO_NAME:      ${{ github.event.repository.name }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
        run: node agent.js
        working-directory: sockacademy/agents/A17_token_refresher
