name: A19 — Returns Intelligence (Weekly)

on:
  schedule:
    - cron: '30 8 * * 2'  # Tuesday 08:30 UTC — dormant until LAUNCH_MODE; weekly stagger per FABLE5_CRON_EFFICIENCY.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reads data, skips DB write + email)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  returns-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A19_returns_intelligence/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A19_returns_intelligence
        run: npm ci

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A19, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A19 Returns Intelligence
        working-directory: sockacademy/agents/A19_returns_intelligence
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_SHOP_DOMAIN:   ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN:  ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
          LAUNCH_MODE:           'false'
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
