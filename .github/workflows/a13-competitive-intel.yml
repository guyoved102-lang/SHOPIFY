name: A13 — Global Competitive Intelligence

on:
  schedule:
    - cron: '0 6 * * 0'      # Sunday 06:00 UTC — weekly deep scan
    - cron: '0 1 * * 1,3,5'  # Mon/Wed/Fri 01:00 UTC — automated strike alert
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (deep or strike)'
        required: false
        default: 'deep'
        type: choice
        options: ['deep', 'strike']

jobs:
  competitive-intel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A13_competitive_intel/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A13_competitive_intel
        run: npm install

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A13, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A13 Competitive Intelligence Agent
        working-directory: sockacademy/agents/A13_competitive_intel
        env:
          LAUNCH_MODE: 'false'
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "strike" ] || [ "${{ github.event.schedule }}" = "0 1 * * 1,3,5" ]; then
            echo "Running in STRIKE mode (automated)"
            node agent.js --strike
          else
            echo "Running in DEEP SCAN mode"
            node agent.js
          fi
