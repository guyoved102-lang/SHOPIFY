name: A13  -  Global Competitive Intelligence (Weekly)

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  competitive-intel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A13_competitive_intel/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A13_competitive_intel
        run: npm install

      - name: Run A13 Competitive Intelligence Agent
        working-directory: sockacademy/agents/A13_competitive_intel
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
