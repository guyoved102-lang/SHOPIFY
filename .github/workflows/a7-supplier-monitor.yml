name: A7 — Supplier Monitor

on:
  schedule:
    - cron: '30 5 * * *'  # 05:30 UTC daily — moved from 06:00 to avoid A0/A7 same-minute Supabase collision (FABLE5_CRON_EFFICIENCY.md issue 3)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reads/detects changes, skips Shopify writes + Supabase state + email)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  monitor:
    name: Monitor Supplier Stock & Prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A7_supplier_monitor/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A7_supplier_monitor

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A7, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A7 Supplier Monitor
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STOCK_LOW_THRESHOLD: ${{ secrets.STOCK_LOW_THRESHOLD }}
          PRICE_WARN_PCT: ${{ secrets.PRICE_WARN_PCT }}
          PRICE_CRITICAL_PCT: ${{ secrets.PRICE_CRITICAL_PCT }}
          MARKUP_MULTIPLIER: ${{ secrets.MARKUP_MULTIPLIER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
        working-directory: sockacademy/agents/A7_supplier_monitor
