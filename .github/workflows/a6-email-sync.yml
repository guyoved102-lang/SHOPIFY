name: A6 — Klaviyo Email Sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'sockacademy/agents/A6_email_sync/agent.js'

jobs:
  sync:
    name: Sync Klaviyo Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A6_email_sync/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A6_email_sync

      - name: Run A6 Email Sync
        env:
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: sockacademy/agents/A6_email_sync
