name: A9 — Legal Compliance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Shopify publish, no HITL approval request)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  legal:
    name: Publish Legal Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A9_legal_compliance/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A9_legal_compliance

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A9, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A9 Legal Compliance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
        working-directory: sockacademy/agents/A9_legal_compliance
