name: A5  -  Social Content Agent

on:
  schedule:
    - cron: '0 7 * * 0'
    - cron: '0 7 * * 3'
    - cron: '0 7 * * 5'
  workflow_dispatch:

jobs:
  social-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sockacademy/agents/A5_social
        run: npm install

      - name: Install corp/core dependencies
        # qa-gate.js (Module 2) requires @anthropic-ai/sdk directly, and
        # self-heal.js (Module 3) requires @anthropic-ai/sdk + hitl.js's
        # @supabase/supabase-js/nodemailer — corp/core is a sibling directory,
        # not an ancestor of A5, so Node module resolution needs corp/core's
        # OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A5 Social Agent
        working-directory: sockacademy/agents/A5_social
        env:
          # Explicit, not implicit (tracker item 0 Part 2, mirrors A9_ARM philosophy) — the scheduled
          # cron must never accidentally go live. Going live requires a deliberate, separate edit here
          # to DRY_RUN=false PLUS adding A5_ARM=true, never just a workflow_dispatch click.
          DRY_RUN: 'true'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
