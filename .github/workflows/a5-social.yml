name: A5 — Social Content Agent (Weekly)

on:
  schedule:
    - cron: '0 6 * * 0'  # כל ראשון 06:00 UTC (09:00 ישראל) — לוח תוכן לשבוע
  workflow_dispatch:

jobs:
  social-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: sockacademy/agents/A5_social
        run: npm install

      - name: Run A5 Social Agent
        working-directory: sockacademy/agents/A5_social
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # להפעלה מלאה — הוסף ב-GitHub Secrets:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          # תמונות לפרסום (URL ציבורי לכל סוג פוסט):
          # IG_IMAGE_EDUCATION: ${{ secrets.IG_IMAGE_EDUCATION }}
          # IG_IMAGE_PRODUCT: ${{ secrets.IG_IMAGE_PRODUCT }}
          # IG_IMAGE_LIFESTYLE: ${{ secrets.IG_IMAGE_LIFESTYLE }}
        run: node agent.js
