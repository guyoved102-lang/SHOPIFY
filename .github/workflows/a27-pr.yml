name: A27 — PR Agent

on:
  schedule:
    - cron: '0 7 * * 5'   # Friday 07:00 UTC — editorial planning day
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A27_pr/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A27_pr

      - name: Run A27 PR Agent
        run: node agent.js
        working-directory: sockacademy/agents/A27_pr
        env:
          LAUNCH_MODE:          'false'
          OUTREACH_ACTIVE:      'false'
          DRY_RUN:              'true'
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY:   ${{ secrets.PERPLEXITY_API_KEY }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
