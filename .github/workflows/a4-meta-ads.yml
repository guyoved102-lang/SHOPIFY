name: A4 — Meta Ads Agent (Daily)

on:
  schedule:
    - cron: '0 6 * * *'  # כל יום 06:00 UTC (09:00 ישראל)
  workflow_dispatch:

jobs:
  meta-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: sockacademy/agents/A4_meta_ads
        run: npm install

      - name: Run A4 Meta Ads Agent
        working-directory: sockacademy/agents/A4_meta_ads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # להפעלה מלאה — הוסף ב-GitHub Secrets:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          node -e "console.log('TOKEN_LEN:', process.env.META_ACCESS_TOKEN?.length, 'STARTS:', process.env.META_ACCESS_TOKEN?.substring(0,6)); console.log('AD_ACCOUNT starts:', process.env.META_AD_ACCOUNT_ID?.substring(0,4))"
          node agent.js
