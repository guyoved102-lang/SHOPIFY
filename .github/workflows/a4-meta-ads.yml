name: A4  -  Meta Ads Agent (Weekly)

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  meta-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sockacademy/agents/A4_meta_ads
        run: npm install

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A4, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A4 Meta Ads Agent
        working-directory: sockacademy/agents/A4_meta_ads
        env:
          LAUNCH_MODE: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
