name: A4  -  Meta Ads Agent (Weekly)

on:
  schedule:
    - cron: '0 7 * * 2'  # ׳›׳ ׳©׳׳™׳©׳™ 07:00 UTC (10:00 ׳™׳©׳¨׳׳)
  workflow_dispatch:

jobs:
  meta-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sockacademy/agents/A4_meta_ads
        run: npm install

      - name: Run A4 Meta Ads Agent
        working-directory: sockacademy/agents/A4_meta_ads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # ׳׳”׳₪׳¢׳׳” ׳׳׳׳”  -  ׳”׳•׳¡׳£ ׳‘-GitHub Secrets:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: node agent.js
