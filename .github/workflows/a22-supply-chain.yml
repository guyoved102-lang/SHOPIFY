name: A22 — Supply Chain Intelligence (Daily)

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reads data, skips DB write + email)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  supply-chain-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A22_supply_chain/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A22_supply_chain
        run: npm ci

      - name: Run A22 Supply Chain Intelligence
        working-directory: sockacademy/agents/A22_supply_chain
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          CJ_API_KEY:            ${{ secrets.CJ_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
          LAUNCH_MODE:           'false'
        run: node agent.js
