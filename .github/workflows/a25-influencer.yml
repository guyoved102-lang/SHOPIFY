name: A25 — Influencer Outreach

on:
  schedule:
    - cron: '0 9 * * *'    # 09:00 UTC daily — 1h before A21 (10:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A25_influencer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A25_influencer

      - name: Run A25 Influencer Outreach Agent
        run: node agent.js
        working-directory: sockacademy/agents/A25_influencer
        env:
          LAUNCH_MODE:          'false'
          DRY_RUN:              'false'
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
