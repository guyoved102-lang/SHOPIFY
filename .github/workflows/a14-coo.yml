name: A14 — COO Weekly Operations Report

on:
  schedule:
    - cron: '0 10 * * 1'  # Monday 10:00 UTC — after A0 (09:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email sent)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  coo-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A14_coo/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A14_coo
        run: npm install

      - name: Run A14 COO Report
        working-directory: sockacademy/agents/A14_coo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node agent.js
