name: A8 — Analytics Reporter (Weekly)

on:
  schedule:
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC — dormant until LAUNCH_MODE; moved from 07:00 to avoid A5/A8 same-minute Supabase collision (FABLE5_CRON_EFFICIENCY.md issue 4)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (true = no email sent)'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sockacademy/agents/A8_analytics_reporter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A8_analytics_reporter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A8, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A8 Analytics Reporter
        working-directory: sockacademy/agents/A8_analytics_reporter
        env:
          GA4_PROPERTY_ID:              ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD:           ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:                      ${{ github.event.inputs.dry_run || 'false' }}
          LAUNCH_MODE:                  'false'
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node agent.js
