name: A0  -  Orchestrator (Daily Health Check)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Sheets writes, no emails)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      force_weekly_report:
        description: 'Force send Weekly Health Report now'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sockacademy/agents/A0_orchestrator/package-lock.json
            sockacademy/corp/core/package-lock.json

      - name: Install dependencies
        working-directory: sockacademy/agents/A0_orchestrator
        run: npm install

      - name: Install corp/core dependencies
        # corp/core/inbox.js requires 'imapflow' — corp/core is a sibling
        # directory, not an ancestor of A0_orchestrator, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A0 Orchestrator
        working-directory: sockacademy/agents/A0_orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PERSONAL_APP_PASSWORD: ${{ secrets.GMAIL_PERSONAL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_WEEKLY_REPORT: ${{ github.event.inputs.force_weekly_report || 'false' }}
        run: node agent.js
