name: A1  -  Product Research (Weekly)

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sockacademy/agents/A1_product_research
        run: npm install

      - name: Run A1 Product Research Agent
        working-directory: sockacademy/agents/A1_product_research
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          KLAVIYO_PRIVATE_API_KEY: ${{ secrets.KLAVIYO_PRIVATE_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MAKE_A1_WEBHOOK: ${{ secrets.MAKE_A1_WEBHOOK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node agent.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: a1-results-${{ github.run_number }}
          path: sockacademy/agents/A1_product_research/last_run.json
          retention-days: 30
