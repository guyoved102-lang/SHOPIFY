name: A24 — CRO Agent

on:
  schedule:
    - cron: '0 11 * * *'    # 11:00 UTC daily — 1h after A21 (10:00 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A24_cro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A24_cro

      - name: Run A24 CRO Agent
        run: node agent.js
        working-directory: sockacademy/agents/A24_cro
        env:
          DRY_RUN:                    'false'
          GA4_ACTIVE:                 'false'
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_MASTER_TOKEN:       ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          SHOPIFY_SHOP_DOMAIN:        ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID:            ${{ secrets.GA4_PROPERTY_ID }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
