name: Verify Self-Heal (Module 3 — manual verification only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which path to verify'
        required: true
        type: choice
        options:
          - code
          - infra
        default: code

jobs:
  verify:
    name: Run self-heal verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/corp/core/package-lock.json

      - name: Install corp/core dependencies
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run verify-self-heal.js
        working-directory: sockacademy/scripts/ci
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
        run: node verify-self-heal.js --mode=${{ inputs.mode }}
