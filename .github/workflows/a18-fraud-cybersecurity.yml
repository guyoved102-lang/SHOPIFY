name: A18 — Fraud & Cybersecurity

on:
  schedule:
    - cron: '0 9 * * *'    # 09:00 UTC daily — 30 min after A19 (08:30 UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A18_fraud_cybersecurity/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sockacademy/agents/A18_fraud_cybersecurity

      - name: Install corp/core dependencies
        # self-heal.js (Module 3) requires @anthropic-ai/sdk directly, and
        # hitl.js requires @supabase/supabase-js + nodemailer — corp/core is
        # a sibling directory, not an ancestor of A18, so Node module
        # resolution needs corp/core's OWN node_modules populated here.
        working-directory: sockacademy/corp/core
        run: npm install

      - name: Run A18 Fraud & Cybersecurity
        run: node agent.js
        working-directory: sockacademy/agents/A18_fraud_cybersecurity
        env:
          DRY_RUN:              'false'
          LAUNCH_MODE:          'false'
          CLOUDFLARE_ACTIVE:    'false'
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          SHOPIFY_SHOP_DOMAIN:  ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_REPO_NAME: ${{ github.event.repository.name }}
