name: A12 — Review Collector

on:
  schedule:
    - cron: '0 7 * * *'  # 09:00 Israel (UTC+2) — daily
  workflow_dispatch:

# Requires Judge.me app installed in Shopify:
# https://apps.shopify.com/judge-me-product-reviews
# Without Judge.me, review links will not render the widget.

jobs:
  reviews:
    name: Send Review Requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A12_review_collector/package.json

      - name: Install dependencies
        run: npm install
        working-directory: agents/A12_review_collector

      - name: Run A12 Review Collector
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A12_review_collector
