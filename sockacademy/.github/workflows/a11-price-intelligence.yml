name: A11 — Price Intelligence

on:
  schedule:
    - cron: '0 6 * * 3'  # 08:00 Israel (UTC+2) — every Wednesday
  workflow_dispatch:

jobs:
  prices:
    name: Monitor Competitor Prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A11_price_intelligence/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A11_price_intelligence

      - name: Run A11 Price Intelligence
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A11_price_intelligence
