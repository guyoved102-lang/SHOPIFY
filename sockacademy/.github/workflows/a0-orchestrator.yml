name: A0 — Orchestrator (Weekly Pipeline)

# Master pipeline: A1 Research → A3 Blog (informed by A1 data)
# A2 remains on its own schedule (requires human approval gate in Google Sheets)
#
# Timeline (Israel time, UTC+3 summer):
#   09:00 — A1 runs (product research + Google Sheets write)
#   09:45 — A3 runs (blog post, topic informed by A1's top category)
#   Guy approves products in Google Sheets during the day
#   13:00 — A2 runs independently (uploads approved products to Shopify)

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 09:00 Israel (UTC+3)
  workflow_dispatch:
    inputs:
      skip_a1:
        description: 'Skip A1 (use existing last_run.json from previous run)'
        type: boolean
        default: false
      skip_a3:
        description: 'Skip A3 blog post this week'
        type: boolean
        default: false

jobs:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 1: A1 — Product Research
  # Output: last_run.json artifact + GITHUB_OUTPUT vars for downstream
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  a1-research:
    name: "A1 — Product Research"
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_a1 != true }}
    outputs:
      top_category: ${{ steps.extract.outputs.top_category }}
      top_product_name: ${{ steps.extract.outputs.top_product_name }}
      trend_keywords: ${{ steps.extract.outputs.trend_keywords }}
      total_scanned: ${{ steps.extract.outputs.total_scanned }}
      total_passed: ${{ steps.extract.outputs.total_passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A1_product_research/package-lock.json

      - name: Install A1 dependencies
        run: npm ci
        working-directory: agents/A1_product_research

      - name: Run A1 Product Research
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
        run: node agent.js
        working-directory: agents/A1_product_research

      # Extract structured outputs from last_run.json for downstream agents
      - name: Extract A1 state outputs
        id: extract
        run: |
          node -e "
          const fs = require('fs');
          const path = 'agents/A1_product_research/last_run.json';
          if (!fs.existsSync(path)) {
            console.log('top_category=Premium Materials');
            console.log('top_product_name=');
            console.log('trend_keywords=merino,bamboo,premium');
            console.log('total_scanned=0');
            console.log('total_passed=0');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(path, 'utf8'));
          const top = s.top10?.[0] || {};
          const allMaterials = (s.top10 || []).flatMap(p => p.materials || []);
          const uniqueMaterials = [...new Set(allMaterials)].slice(0, 6);
          const category = top.category || 'Premium Materials';
          console.log('top_category=' + category);
          console.log('top_product_name=' + (top.name || '').replace(/[^\w\s-]/g, ''));
          console.log('trend_keywords=' + uniqueMaterials.join(','));
          console.log('total_scanned=' + (s.totalScanned || 0));
          console.log('total_passed=' + (s.totalPassed || 0));
          " >> \$GITHUB_OUTPUT

      - name: Upload A1 state artifact (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: a1-weekly-state
          path: agents/A1_product_research/last_run.json
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 2: A3 — Blog Content (A1-informed)
  # Waits for A1, downloads artifact, picks blog topic aligned with A1 findings
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  a3-content:
    name: "A3 — Blog Content (A1-informed)"
    runs-on: ubuntu-latest
    needs: a1-research
    if: ${{ always() && inputs.skip_a3 != true && (needs.a1-research.result == 'success' || needs.a1-research.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v4

      - name: Download A1 state artifact
        uses: actions/download-artifact@v4
        with:
          name: a1-weekly-state
          path: agents/A3_content/a1_state/
        continue-on-error: true  # Graceful if A1 was skipped

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A3_content/package-lock.json

      - name: Install A3 dependencies
        run: npm ci
        working-directory: agents/A3_content

      - name: Run A3 Content Agent (with A1 context)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          # A1 context injected — agent uses these to align blog topic with weekly findings
          A1_TOP_CATEGORY: ${{ needs.a1-research.outputs.top_category }}
          A1_TREND_KEYWORDS: ${{ needs.a1-research.outputs.trend_keywords }}
          A1_TOP_PRODUCT: ${{ needs.a1-research.outputs.top_product_name }}
          A1_STATE_PATH: a1_state/last_run.json
        run: node agent.js
        working-directory: agents/A3_content

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # PIPELINE SUMMARY — posted after all jobs complete
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [a1-research, a3-content]
    if: always()

    steps:
      - name: Report pipeline status
        run: |
          echo "═══════════════════════════════════════"
          echo "  A0 Orchestrator — Weekly Pipeline"
          echo "═══════════════════════════════════════"
          echo "  A1 Research : ${{ needs.a1-research.result }}"
          echo "  A3 Blog     : ${{ needs.a3-content.result }}"
          echo "───────────────────────────────────────"
          echo "  A1 Context Passed to A3:"
          echo "    Category  : ${{ needs.a1-research.outputs.top_category }}"
          echo "    Top Prod  : ${{ needs.a1-research.outputs.top_product_name }}"
          echo "    Trend KWs : ${{ needs.a1-research.outputs.trend_keywords }}"
          echo "    Scanned   : ${{ needs.a1-research.outputs.total_scanned }}"
          echo "    Passed    : ${{ needs.a1-research.outputs.total_passed }}"
          echo "═══════════════════════════════════════"
          echo "  Next: Guy approves products in Google Sheets"
          echo "  A2 picks up approved products at 13:00 Israel"
          echo "═══════════════════════════════════════"
