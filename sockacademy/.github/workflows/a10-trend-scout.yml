name: A10 — Trend Scout

on:
  schedule:
    - cron: '0 6 * * 0'  # 08:00 Israel (UTC+2) — every Sunday
  workflow_dispatch:

jobs:
  trends:
    name: Scout Market Trends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A10_trend_scout/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A10_trend_scout

      - name: Run A10 Trend Scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A10_trend_scout
