name: A13 — Competitive Intelligence

on:
  schedule:
    # Weekly deep scan — Monday 06:00 UTC (09:00 Israel)
    - cron: '0 6 * * 1'
    # Strike alert — Wednesday + Friday 06:00 UTC
    - cron: '0 6 * * 3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'deep'
        type: choice
        options:
          - deep
          - strike
          - dry-run

jobs:
  competitive-intel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sockacademy/agents/A13_competitive_intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sockacademy/agents/A13_competitive_intel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deep scan (Monday)
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
        run: node agent.js
        env:
          PERPLEXITY_API_KEY:          ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:          ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_EMAIL:                 ${{ secrets.ADMIN_EMAIL }}

      - name: Run strike alert (Wed + Fri)
        if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 3,5'
        run: node agent.js --strike
        env:
          PERPLEXITY_API_KEY:          ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:          ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_EMAIL:                 ${{ secrets.ADMIN_EMAIL }}

      - name: Run manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.mode }}" = "strike" ]; then
            node agent.js --strike
          elif [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            node agent.js --dry-run
          else
            node agent.js
          fi
        env:
          PERPLEXITY_API_KEY:          ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD:          ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          ADMIN_EMAIL:                 ${{ secrets.ADMIN_EMAIL }}
