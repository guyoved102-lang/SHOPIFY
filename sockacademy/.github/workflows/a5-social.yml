name: A5 — Social Content

on:
  schedule:
    - cron: '0 7 * * 0'  # Sunday  09:00 Israel — Education post
    - cron: '0 7 * * 3'  # Wednesday 09:00 Israel — Product Spotlight
    - cron: '0 7 * * 5'  # Friday   09:00 Israel — Lifestyle post
  workflow_dispatch:

# Note: DRY_RUN mode while META_ACCESS_TOKEN + META_IG_USER_ID are not set.
# Add those secrets to GitHub to activate live Instagram publishing.

jobs:
  social:
    name: Publish Social Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A5_social/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A5_social

      - name: Run A5 Social Agent
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A5_social
