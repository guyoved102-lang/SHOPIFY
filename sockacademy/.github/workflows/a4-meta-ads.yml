name: A4 — Meta Ads

on:
  workflow_dispatch:

# Note: DRY_RUN mode while META_ACCESS_TOKEN + META_AD_ACCOUNT_ID are not set.
# Add those secrets to GitHub to activate live ad creation.

jobs:
  ads:
    name: Run Meta Ads Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A4_meta_ads/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A4_meta_ads

      - name: Run A4 Meta Ads
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A4_meta_ads
