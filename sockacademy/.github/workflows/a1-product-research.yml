name: A1 — Product Research

on:
  schedule:
    - cron: '0 8 * * 1'  # 10:00 Israel (UTC+2) — every Monday
  workflow_dispatch:

jobs:
  research:
    name: Research Products
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A1_product_research/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A1_product_research

      - name: Run A1 Product Research
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node agent.js
        working-directory: agents/A1_product_research
