name: A3 — Content (SEO Blog)

on:
  schedule:
    - cron: '0 12 * * 1'  # 14:00 Israel (UTC+2) — every Monday
  workflow_dispatch:

jobs:
  content:
    name: Publish SEO Blog Post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A3_content/package.json

      - name: Install dependencies
        run: npm install
        working-directory: agents/A3_content

      - name: Run A3 Content Agent
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: node agent.js
        working-directory: agents/A3_content
