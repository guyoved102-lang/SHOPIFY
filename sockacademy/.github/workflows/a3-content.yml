name: A3 — Content (SEO Blog)

on:
  # Schedule removed — A0 Orchestrator runs A3 after A1 with enriched context.
  # Use workflow_dispatch for manual re-runs with custom topics.
  workflow_dispatch:

jobs:
  content:
    name: Publish SEO Blog Post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agents/A3_content/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/A3_content

      - name: Run A3 Content Agent
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_MASTER_TOKEN: ${{ secrets.SHOPIFY_MASTER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: node agent.js
        working-directory: agents/A3_content
